name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Code-Prüfung
        run: ruff check .
      - name: Tests inkl. Testset für Wissensfragen
        run: pytest -v

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: portal
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: API gegen PostgreSQL mit pgvector
        run: pytest -v tests/test_api.py
